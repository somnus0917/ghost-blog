name: Project checks

on:
  pull_request:
    paths:
      - "worker/**"
      - "server/**"
      - "scripts/**"
      - "docker-compose.yml"
      - "Caddyfile.snippet"
      - "routes.yaml"
      - ".env.example"
      - "package.json"
      - "package-lock.json"
      - "requirements-fonts.txt"
      - "Makefile"
      - ".github/workflows/project-ci.yml"
      - ".github/workflows/production-monitor.yml"
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "server/**"
      - "scripts/**"
      - "docker-compose.yml"
      - "Caddyfile.snippet"
      - "routes.yaml"
      - ".env.example"
      - "package.json"
      - "package-lock.json"
      - "requirements-fonts.txt"
      - "Makefile"
      - ".github/workflows/project-ci.yml"
      - ".github/workflows/production-monitor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-fonts.txt
      - name: Install Node dependencies
        run: npm ci
      - name: Run project checks
        run: make check
