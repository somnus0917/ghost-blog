name: Ghost theme checks

on:
  pull_request:
    paths:
      - "theme/**"
      - "scripts/build_theme.py"
      - "scripts/build_webfont.mjs"
      - "scripts/check_theme.py"
      - "shared/fonts/lxgw-wenkai-v2/**"
      - "server/deploy-theme.sh"
      - "server/sync-fonts.sh"
      - "package.json"
      - "package-lock.json"
      - "requirements-fonts.txt"
      - "Makefile"
      - ".github/workflows/theme-cicd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run project checks
        run: make check
      - name: Upload checked archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: somnus-yohaku-${{ github.sha }}
          path: build/somnus-yohaku.zip
          if-no-files-found: error
          retention-days: 7
