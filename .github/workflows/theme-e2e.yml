name: Theme browser regression

on:
  pull_request:
    paths:
      - "theme/**"
      - "tests/e2e/**"
      - "scripts/build_theme_assets.mjs"
      - "scripts/run_lighthouse.mjs"
      - "scripts/setup_e2e_ghost.py"
      - "Caddyfile.snippet"
      - "lighthouserc.cjs"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "docker-compose.yml"
      - "docker-compose.e2e.yml"
      - "Makefile"
      - ".github/workflows/theme-e2e.yml"
  push:
    branches: [main]
    paths:
      - "theme/**"
      - "tests/e2e/**"
      - "scripts/build_theme_assets.mjs"
      - "scripts/run_lighthouse.mjs"
      - "scripts/setup_e2e_ghost.py"
      - "Caddyfile.snippet"
      - "lighthouserc.cjs"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "docker-compose.yml"
      - "docker-compose.e2e.yml"
      - "Makefile"
      - ".github/workflows/theme-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies and browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start Ghost and prepare fixtures
        run: make e2e-up
      - name: Run browser regressions
        run: npm run test:e2e
      - name: Enforce Lighthouse budgets
        run: npm run test:lighthouse
      - name: Stop isolated test services
        if: always()
        run: docker compose -f docker-compose.e2e.yml down --volumes
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ github.sha }}
          path: output/playwright
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-${{ github.sha }}
          path: output/lighthouse
          if-no-files-found: ignore
          retention-days: 7
