name = "somnus-blog-engagement"
account_id = "b4749c86984f7a88f573e4e307834846"
main = "src/index.mjs"
compatibility_date = "2026-07-22"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "engagement.somnus.wiki", custom_domain = true }
]

[vars]
ALLOWED_ORIGIN = "https://blog.somnus.wiki"
TINYBIRD_API_URL = "https://api.ap-east-1.aws.tinybird.co"
TINYBIRD_SITE_UUID = "c7e5aff3-9c89-4749-9506-f7a99c9ea550"
GHOST_MEMBERS_PROXY_URL = "https://blog.somnus.wiki/members/api/_origin/send-magic-link/"
TURNSTILE_HOSTNAME = "blog.somnus.wiki"
TURNSTILE_ACTION = "member-signup"

[[d1_databases]]
binding = "DB"
database_name = "somnus-blog-engagement"
database_id = "7c1d2a36-80b8-4f25-9c66-a424d15f73ab"
migrations_dir = "migrations"

[triggers]
crons = ["*/10 * * * *"]

[[ratelimits]]
name = "ENGAGEMENT_RATE_LIMITER"
namespace_id = "91017"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "SIGNUP_RATE_LIMITER"
namespace_id = "91018"

  [ratelimits.simple]
  limit = 5
  period = 60
